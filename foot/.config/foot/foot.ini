shell=zsh
title=foot
font=FiraCode-Regular Font:size=11
letter-spacing=0
dpi-aware=no
pad=5x5
bold-text-in-bright=no
gamma-correct-blending=no

[main]
term=xterm-256color

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1

[colors]
alpha=0.90

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
