# Hyprland Configuration
# https://wiki.hypr.land/Configuring/

# ==================
# MONITOR CONFIG
# ==================
# monitor = eDP-2, 2560x1600@239.998993, 2560x0, 1, vrr, 1
monitor = , preferred,auto,auto

# ==================
# STARTUP APPS
# ==================
exec-once = qs -c noctalia-shell
exec-once = hypridle

exec-once = [workspace special:spotify silent] spotify 
exec-once = [workspace special:discord silent] discord
exec-once = [workspace special:slack silent] slack 
env = QT_QPA_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QT_QPA_PLATFORMTHEME,gtk3
env = QT_QPA_PLATFORMTHEME_QT6,gtk3
env = TERMINAL,foot

gestures {
    workspace_swipe_distance = 700
    workspace_swipe_cancel_ratio = 0.15
    workspace_swipe_min_speed_to_force = 5
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10
    workspace_swipe_create_new = true
}

gesture = 3, horizontal, workspace


# ==================
# INPUT CONFIG
# ==================
# input {
#     kb_layout = us
#     numlock_by_default = true
# }
device{
  name=gxt7863:00-27c6:01e0-touchpad

  accel_profile =adaptive# flat or adaptive or blank or EMPTY means libinput’s default mode
}
input {
    kb_layout = us
  #kb_layout = us,us
  #kb_variant=colemak,
kb_options =,caps:ctrl_modifier
    numlock_by_default = false
    repeat_delay = 200
    repeat_rate = 35
sensitivity = 0 #mouse sensitivity
accel_profile =flat
follow_mouse = true
    focus_on_close = 1

    touchpad {
        natural_scroll = true
    #disable_while_typing = $touchpadDisableTyping
    #    scroll_factor = $touchpadScrollFactor
    }
}

binds {
    scroll_event_delay = 0
}

# ==================
# GENERAL LAYOUT
# ==================
general {
    gaps_in = 5
    gaps_out = 5
    border_size = 2

    layout = dwindle
}

# ==================
# DECORATION
# ==================
decoration {
    rounding = 12

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 30
        render_power = 5
        offset = 0 5
        color = rgba(00000070)
    }
}

# ==================
# ANIMATIONS
# ==================
animations {
    enabled = true

    animation = windowsIn, 1, 1, default
    animation = windowsOut, 1, 1, default
    animation = workspaces, 1, 1, default
    animation = windowsMove, 1, 1, default
    animation = fade, 1, 3, default
    animation = border, 1, 1, default
}

# ==================
# LAYOUTS
# ==================
dwindle {
    preserve_split = true
}

master {
    mfact = 0.5
}

# ==================
# MISC
# ==================
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ==================
# WINDOW RULES
# ==================
windowrule = tile on, match:class ^(org\.wezfurlong\.wezterm)$

windowrule = rounding 12, match:class ^(org\.gnome\.)

windowrule = tile on, match:class ^(gnome-control-center)$
windowrule = tile on, match:class ^(pavucontrol)$
windowrule = tile on, match:class ^(nm-connection-editor)$

windowrule = float on, match:class ^(gnome-calculator)$
windowrule = float on, match:class ^(galculator)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(org\.gnome\.Nautilus)$
windowrule = float on, match:class ^(xdg-desktop-portal)$

#windowrule = noinitialfocus on, match:class ^(steam)$, match:title ^(notificationtoasts)
windowrule = pin on, match:class ^(steam)$, match:title ^(notificationtoasts)

windowrule = float on, match:class ^(firefox)$, match:title ^(Picture-in-Picture)$
windowrule = float on, match:class ^(zoom)$

# Noctalia (Quickshell) windows floating by default
# ! Hyprland doesn't size these windows correctly so disabling by default here
# windowrule = float on, match:class ^(org.quickshell)$

layerrule = no_anim on, match:namespace ^(quickshell)$

source = ./conf/colors.conf
source = ./conf/outputs.conf
source = ./conf/layout.conf
source = ./conf/cursor.conf
source = ./conf/binds.conf
